[project]
name = "my-sample-project"
version = "1.2.3"
description = "A sample project for testing"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28.0",
    "click>=8.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
docs = [
    "sphinx>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"

[tool.hatch.build.targets.wheel]
packages = ["src/my_project"]

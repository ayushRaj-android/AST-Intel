openapi: "3.0.3"
info:
  title: Petstore API
  version: "1.0.0"
  description: A sample API for managing pets.

paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets
      responses:
        "200":
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
    post:
      operationId: createPet
      summary: Create a pet
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
      responses:
        "201":
          description: Pet created

  /pets/{petId}:
    get:
      operationId: getPetById
      summary: Get a pet by ID
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
    put:
      operationId: updatePet
      summary: Update a pet
      responses:
        "200":
          description: Pet updated
    delete:
      operationId: deletePet
      summary: Delete a pet
      responses:
        "204":
          description: Pet deleted

  /health:
    get:
      operationId: healthCheck
      summary: Health check endpoint
      responses:
        "200":
          description: OK

components:
  schemas:
    Pet:
      type: object
      description: A pet in the store.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        tag:
          type: string
        owner:
          $ref: "#/components/schemas/Owner"

    Owner:
      type: object
      description: Pet owner information.
      properties:
        name:
          type: string
        email:
          type: string
          format: email

    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
